# =============================================================================
# Robinity Intelligence — Nginx Reverse Proxy Yapılandırması
# Konum: /etc/nginx/sites-available/robinity.conf
# =============================================================================

# HTTP -> HTTPS Yönlendirmesi (SSL sertifikası kurulduktan sonra aktif edin)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # SSL kullanacaksanız bu blokları certbot ile açın:
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    client_max_body_size 10M;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ─── SSE (Server-Sent Events) ve Analiz İlerleme Akışları ─────────────────
    # /api/risk/analyses/:jobId/events rotasında buffering kesinlikle KAPALI olmalıdır!
    location ~ ^/api/risk/analyses/[^/]+/events$ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        # SSE için kritik ayarlar:
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;

        # Header aktarımı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Statik Asset Önbellekleme ───────────────────────────────────────────
    location /web/dist/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Statik dosyalar için tarayıcı önbelleği (immutable)
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ─── Genel Uygulama & API Yönlendirmesi ─────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        # WebSocket desteği
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # İstemci IP ve Host bilgileri (serve-app.js TRUST_PROXY=1 ile okur)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman aşımları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
